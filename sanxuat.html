<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="VIBA Sản xuất"><meta name="theme-color" content="#1f8a52">
<title>VIBA Sản xuất</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css?v=132"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest-sanxuat.json">
<style>
.sxbig{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:16px;padding:13px 14px;margin-bottom:10px;color:#fff;text-align:left;font-family:inherit;cursor:pointer}
.sxbig b{display:block;font-size:19px;font-weight:800}.sxbig small{display:block;font-size:12.5px;opacity:.9;font-weight:500}
.sxbig .n,.kn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.25);display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex:none;color:#fff}
.kn{width:32px;height:32px;font-size:17px;vertical-align:middle}
.sec{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:14px 4px 6px;letter-spacing:.02em}
label.f{display:block;margin-bottom:12px}label.f .lab{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
.sxin,.sxsel{font-size:18px!important;font-weight:700}.sxsel{border:2px solid var(--accent)!important}
.auto{background:var(--sunk);border-radius:12px;padding:9px 11px;font-size:13.5px;color:var(--muted);margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.qcr{display:grid;grid-template-columns:1fr 78px 1.1fr;gap:6px}.qcr .lb{display:block;font-size:11.5px;color:var(--muted);margin-bottom:2px}
.qcr input,.qcr select{font-size:17px;font-weight:700}.qcr select{border:2px solid var(--accent)}
.qck{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px;min-height:16px}
.addb{display:block;width:100%;border:2px dashed var(--accent);color:var(--accent);background:transparent;border-radius:12px;padding:10px;font-weight:700;font-size:15px;margin-bottom:12px;font-family:inherit}
.opt{display:flex;gap:6px}.opt button{flex:1;border:2px solid var(--line);border-radius:12px;padding:9px 4px;font-size:14px;font-weight:600;background:var(--card);color:var(--fg);font-family:inherit}.opt .on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.xq,.ncin,.dmin{width:84px;text-align:right;font-weight:700}.ncin{width:42px;margin-left:4px;padding-left:3px;padding-right:3px}.nchd{display:flex;justify-content:flex-end;gap:16px;margin:0 20px 4px;font-size:10.5px;color:var(--muted);font-weight:700}.nchd span{width:42px;text-align:center;line-height:1.1}.dmin{width:110px}
.lnk{border:0;background:none;color:var(--bad);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.chk{display:flex;gap:8px;align-items:center;font-size:15px;margin:4px 0 12px}.chk input{width:20px;height:20px;min-height:0;flex:none}
.sxsave{font-size:18px;padding:14px;margin-top:4px}
table.gt{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}table.gt td,table.gt th{padding:5px 2px;border-top:1px solid var(--line);text-align:right}table.gt td:first-child,table.gt th:first-child{text-align:left}
.nccl{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);margin:-6px 0 12px;overflow:hidden;max-height:330px;overflow-y:auto}
.nccl div{padding:10px 12px;border-top:1px solid var(--line);font-size:15px;cursor:pointer}.nccl div:first-child{border-top:0}.nccl small{color:var(--muted);font-size:11.5px;margin-left:8px}.nccl .nnew{color:var(--accent);font-weight:700}
</style></head><body>
<div class="wrap" id="wrap">
  <div class="brandbar"><img src="logo2.png" alt="VIBA FOOD"><span class="tag">Sản xuất</span></div>
  <header class="top"><div class="who" id="who"><span class="chip">Đang kết nối…</span></div><div id="modeSw"></div></header>
  <main id="view"></main>
</div>
<nav class="tabbar" id="tabbar" hidden><div class="in" id="tabs"></div></nav>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
