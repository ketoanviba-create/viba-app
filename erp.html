<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B69A3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="VIBA ERP"><title>VIBA ERP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css?v=151"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="icon.png">
<style>
.tb{display:flex;gap:6px;overflow-x:auto;margin:10px 0;padding-bottom:2px}.tb button{flex:none;border:1.5px solid var(--line);border-radius:999px;padding:8px 13px;background:var(--card);font:600 14px inherit;font-family:inherit;color:var(--fg);cursor:pointer}
.tb button.on{border-color:#1B69A3;background:#E8F1F8;color:#1B69A3}.tb.sm button{font-size:12.5px;padding:5px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}.card label{display:block;font-size:13px;font-weight:600;margin-bottom:10px}
.card label input,.card label select{display:block;width:100%;margin-top:4px;font-size:16px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sec{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:6px 2px}
.ln{display:grid;grid-template-columns:1.4fr .7fr 1fr .9fr 30px;gap:5px;align-items:center;margin-bottom:6px}.ln input{font-size:15px;min-width:0}.ln b{font-size:13px;text-align:right}
.x{border:0;background:none;color:#c0392b;font-size:16px;cursor:pointer}.add{width:100%;border:2px dashed #1B69A3;color:#1B69A3;background:none;border-radius:10px;padding:8px;font:700 14px inherit;font-family:inherit;margin:4px 0 10px}
.tot{text-align:right;margin-bottom:10px}.b2{border:0;border-radius:10px;padding:11px;font:700 15px inherit;font-family:inherit;background:#1B69A3;color:#fff;cursor:pointer;width:100%}.b2.g{background:var(--sunk);color:var(--fg)}
.chip{color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;vertical-align:middle}.mut{color:var(--muted);font-size:12.5px}.dh{cursor:pointer}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.acts button{border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:6px 11px;font:600 13px inherit;font-family:inherit;cursor:pointer;color:var(--fg)}
.acts .ok{background:#1f8a52;border-color:#1f8a52;color:#fff}.acts .dg{color:#c0392b}
table.lt{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}table.lt td,table.lt th{border-top:1px solid var(--line);padding:5px 4px;text-align:left}table.lt th{color:var(--muted);font-weight:600}
@media(max-width:520px){.ln{grid-template-columns:1fr .6fr .9fr 26px}.ln b{display:none}}
</style></head><body>
<div class="wrap" id="wrap" style="max-width:900px">
  <div class="brandbar"><img src="logo2.png" alt="VIBA FOOD"><span class="tag">ERP · Chứng từ & Kho</span></div>
  <main id="view"><div class="chip" style="background:#888">Đang kết nối…</div></main>
</div>
<div id="toast" hidden></div>
<script>window.APP_MODE="erp";</script><script src="config.js?v=151"></script><script src="gas-shim.js?v=152"></script><script src="erp.js?v=2"></script></body></html>
