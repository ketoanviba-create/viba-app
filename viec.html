<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B69A3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="VIBA Việc"><title>VIBA – Công việc</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css?v=151"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="icon.png">
<style>
.tb{display:flex;gap:6px;overflow-x:auto;margin:10px 0;padding-bottom:2px}.tb button{flex:none;border:1.5px solid var(--line);border-radius:999px;padding:8px 13px;background:var(--card);font:600 14px inherit;font-family:inherit;color:var(--fg);cursor:pointer}
.tb button.on{border-color:#1B69A3;background:#E8F1F8;color:#1B69A3}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.sec{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:6px 2px}
.chip{color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;vertical-align:middle}.mut{color:var(--muted);font-size:12.5px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.acts button{border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:6px 11px;font:600 13px inherit;font-family:inherit;cursor:pointer;color:var(--fg)}
.acts .ok{background:#1f8a52;border-color:#1f8a52;color:#fff}
table.lt{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}table.lt td{border-top:1px solid var(--line);padding:5px 4px;text-align:left}
.t{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}.th{cursor:pointer}.t select,.t input{display:block;width:100%;margin-top:6px;font-size:15px}.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}.kp div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--muted);font-size:13px}.kp b{display:block;font-size:22px;color:var(--fg)}#dd{flex:none;font-size:14px}
</style></head><body>
<div class="wrap" id="wrap" style="max-width:900px">
  <div class="brandbar"><a href="./" title="Về app chính" style="display:flex;align-items:center;gap:8px;text-decoration:none"><img src="logo2.png" alt="VIBA FOOD"><span class="btn sm">← Về app</span></a><span class="tag">Công việc</span></div>
  <main id="view"><div class="chip" style="background:#888">Đang kết nối…</div></main>
</div>
<div id="toast" hidden></div>
<script>window.APP_MODE="viec";</script><script src="config.js?v=151"></script><script src="gas-shim.js?v=152"></script><script src="viec.js?v=5"></script><script>/* v136: "Về app" đưa về đúng trang của vị trí, không về trang Chọn ứng dụng */(function(){let P=null;const go=async()=>{for(let i=0;i<80&&!(window.vibaErp&&vibaErp.me()&&window.claude);i++)await new Promise(r=>setTimeout(r,150));const me=window.vibaErp&&vibaErp.me();if(!me)return;if(me.owner){P='quanly.html';return}try{const db=await claude.use('db');const st=(await db.doc('staff/'+me.uid).get()).data()||{};P={sale:'sale.html',ship:'ship.html',kho:'kho.html',sx:'sanxuat.html',view:'xem.html'}[st.role]||null}catch(e){}};go();document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;const h=a.getAttribute('href');if(h==='./'||h==='index.html'||h==='/viba-app/'){e.preventDefault();location.href=P||(history.length>1?'javascript:history.back()':'./');if(!P&&history.length>1)history.back()}},true)})();</script></body></html>
